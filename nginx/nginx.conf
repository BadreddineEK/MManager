limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Nidham (prod)
#
# Architecture :
#   nidham.fr           → landing page marketing  (frontend/landing/)
#   app.nidham.fr       → portail SaaS            (frontend/app/)
#   *.nidham.fr         → app mosquée (SPA)       (frontend/mosque/)
#
#   /api/ /admin/ /health/ → proxy Django backend-prod:8000
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════════════
# 1. nidham.fr — Landing page marketing
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name nidham.fr www.nidham.fr;

    # Logs
    access_log /var/log/nginx/landing.access.log;
    error_log  /var/log/nginx/landing.error.log warn;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    location / {
        root  /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /landing/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# 2. app.nidham.fr — Portail SaaS (inscription / connexion mosquées)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name app.nidham.fr;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    location /static/ {
        alias /usr/share/nginx/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /api/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass        http://backend-prod:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        client_max_body_size 1M;
    }

    location ~ ^/(api|admin|health|nidham-admin)/ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass        http://backend-prod:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  Cookie            $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 50M;
        proxy_read_timeout   120s;
    }

    location / {
        root  /usr/share/nginx/html/app;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# 3. *.nidham.fr — App gestion mosquée (SPA par tenant)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.nidham\.fr$;

    access_log /var/log/nginx/mosque.access.log;
    error_log  /var/log/nginx/mosque.error.log warn;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    location /static/ {
        alias /usr/share/nginx/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /api/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass        http://backend-prod:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        client_max_body_size 1M;
    }

    location ~ ^/(api|admin|health)/ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass        http://backend-prod:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  Cookie            $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 50M;
        proxy_read_timeout   120s;
    }

    location / {
        root  /usr/share/nginx/html/mosque;
        index index.html;
        try_files $uri $uri/ /mosque/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# 4. Catch-all → redirect vers nidham.fr
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    server_name _;
    return 301 http://nidham.fr$request_uri;
}
